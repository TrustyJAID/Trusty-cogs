[project]
requires-python = ">=3.8"

[tool.black]
    line-length = 99
    target-version = ['py38']
    include = '\.py$'
    exclude = '''
    /(
          \.eggs
        | \.git
        | \.hg
        | \.mypy_cache
        | \.tox
        | \.venv
        | _build
        | buck-out
        | build
        | dist
        | redbot\/vendored
    )/
    '''

[tool.isort]
  profile = "black"

[tool.pyright]
  reportImplicitStringConcatenation = false
  pythonVersion = "3.8"
  typeCheckingMode = "basic"

[tool.ruff]
    line-length = 99
    target-version = "py38"

[tool.ruff.lint]
    future-annotations = false
    ignore = [
        "I001", # Example: Ignore specific import sorting/future constraints if needed
    ]
